name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./devblog-frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./devblog-frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./devblog-backend
        run: npm ci || npm install

      - name: Build Backend
        working-directory: ./devblog-backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: ./devblog-backend
        run: npm test || echo "Tests not strictly implemented yet but CI is wired"
